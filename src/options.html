<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Theatre Vision Site Rules</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1 class="brand-heading">
          <img class="brand-logo" src="../assets/logo.png" alt="Theatre Vision">
        </h1>
        <div>
          <p class="subtitle">Make every video feel like a theatre experience.</p>
        </div>
      </header>

      <section class="section" aria-labelledby="blockedHeading">
        <h2 id="blockedHeading">Blocked domains</h2>
        <p class="section-copy">Theatre mode stays off on these domains.</p>
        <div class="row">
          <label class="visually-hidden" for="domainInput">Domain to block</label>
          <input id="domainInput" type="text" placeholder="youtube.com" autocomplete="url">
          <button id="addButton" type="button">Block domain</button>
        </div>
        <p id="blockedStatus" class="field-status" role="status" aria-live="polite" hidden></p>
        <div id="domainList" class="domain-list" aria-live="polite"></div>
      </section>

      <section class="section" aria-labelledby="enabledHeading">
        <h2 id="enabledHeading">Enabled exceptions</h2>
        <p class="section-copy">These domains stay enabled inside a blocked parent domain.</p>
        <div class="row">
          <label class="visually-hidden" for="enabledDomainInput">Domain to enable</label>
          <input id="enabledDomainInput" type="text" placeholder="subdomain.youtube.com" autocomplete="url">
          <button id="enableButton" type="button">Enable domain</button>
        </div>
        <p id="enabledStatus" class="field-status" role="status" aria-live="polite" hidden></p>
        <div id="enabledList" class="domain-list" aria-live="polite"></div>
      </section>

      <footer class="footer">
        <span id="status" role="status" aria-live="polite"></span>
      </footer>

      <section class="author" aria-label="About the author">
        <p>Made by <a class="author-name-link" data-author-link="linkedin" data-author-name-link><strong data-author-name></strong></a></p>
        <nav class="author-links" aria-label="Author links">
          <a data-author-link="linkedin"><img data-author-icon alt=""><span data-author-label></span></a>
          <a data-author-link="github"><img data-author-icon alt=""><span data-author-label></span></a>
          <a data-author-link="sourceCode"><span data-author-label></span></a>
        </nav>
      </section>
    </main>

    <script src="domain-utils.js"></script>
    <script src="author.js"></script>
    <script src="options.js"></script>
  </body>
</html>
