<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="optionsPageTitle">Theatre Vision Site Rules</title>
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/logo_compact_bg_16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/logo_compact_bg_32.png">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1 class="brand-heading">
          <img class="brand-logo" src="../assets/logo_sm.png" alt="Theatre Vision">
        </h1>
        <div>
          <p class="subtitle" data-i18n="optionsSubtitle">Make every video feel like a theatre experience.</p>
        </div>
      </header>

      <section class="section" aria-labelledby="blockedHeading">
        <h2 id="blockedHeading" data-i18n="blockedDomainsHeading">Blocked domains</h2>
        <p class="section-copy" data-i18n="blockedDomainsDescription">Theatre mode stays off on these domains.</p>
        <div class="row">
          <label class="visually-hidden" for="domainInput" data-i18n="domainToBlockLabel">Domain to block</label>
          <input id="domainInput" type="text" placeholder="youtube.com" autocomplete="url">
          <button id="addButton" type="button" data-i18n="blockDomainButton">Block domain</button>
        </div>
        <p id="blockedStatus" class="field-status" role="status" aria-live="polite" hidden></p>
        <div id="domainList" class="domain-list" aria-live="polite"></div>
      </section>

      <section class="section" aria-labelledby="enabledHeading">
        <h2 id="enabledHeading" data-i18n="allowedSubdomainsHeading">Allowed subdomains</h2>
        <p class="section-copy" data-i18n="allowedSubdomainsDescription">Allow a subdomain of a blocked domain, such as video.example.com.</p>
        <div class="row">
          <label class="visually-hidden" for="enabledDomainInput" data-i18n="subdomainToAllowLabel">Subdomain to allow</label>
          <input id="enabledDomainInput" type="text" placeholder="video.example.com" autocomplete="url">
          <button id="enableButton" type="button" data-i18n="allowSubdomainButton">Allow subdomain</button>
        </div>
        <p id="enabledStatus" class="field-status" role="status" aria-live="polite" hidden></p>
        <div id="enabledList" class="domain-list" aria-live="polite"></div>
      </section>

      <footer class="footer">
        <span id="status" role="status" aria-live="polite"></span>
      </footer>

      <section class="author" aria-label="About the author" data-i18n-aria-label="aboutAuthor">
        <p><span data-i18n="madeBy">Made by</span> <a class="author-name-link" data-author-link="linkedin" data-author-name-link><strong data-author-name></strong></a></p>
        <nav class="author-links" aria-label="Author links" data-i18n-aria-label="authorLinks">
          <a data-author-link="linkedin"><img data-author-icon alt=""><span data-author-label></span></a>
          <a data-author-link="github"><img data-author-icon alt=""><span data-author-label></span></a>
          <a data-author-link="sourceCode"><span data-author-label></span></a>
        </nav>
      </section>
    </main>

    <script src="domain-utils.js"></script>
    <script src="i18n.js"></script>
    <script src="author.js"></script>
    <script src="options.js"></script>
  </body>
</html>
