<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Theatre Vision</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="popup">
      <header class="header">
        <img class="brand-icon" src="../assets/logo.png" alt="">
        <div class="brand-copy">
          <h1 class="visually-hidden">Theatre Vision</h1>
          <p class="eyebrow">Video theatre controls</p>
        </div>
      </header>

      <main>
        <section class="site-section" aria-labelledby="sectionTitle">
          <div class="section-heading">
            <h2 id="sectionTitle" class="section-title">Current site</h2>
            <span id="savedStatus" class="saved-status" role="status" aria-live="polite"></span>
          </div>
          <section class="site-card" aria-labelledby="siteName">
            <div class="site-details">
              <span class="site-icon" aria-hidden="true">
                <img id="siteFavicon" class="site-favicon" alt="" hidden>
                <span id="siteIconFallback" class="site-icon-fallback" hidden>
                  <svg class="site-icon-globe" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"></circle>
                    <path d="M3.5 12h17M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path>
                  </svg>
                </span>
              </span>
              <div class="site-copy">
                <h2 id="siteName">Loading site...</h2>
                <p id="siteAddress">Reading the active tab</p>
              </div>
            </div>
            <span id="toggleLabel" class="visually-hidden">Theatre mode</span>
            <button
              id="siteToggle"
              class="switch"
              type="button"
              role="switch"
              aria-labelledby="toggleLabel siteName"
              aria-checked="false"
              aria-disabled="true"
            >
              <span class="switch-track" aria-hidden="true">
                <span class="switch-thumb"></span>
              </span>
            </button>
          </section>

          <p id="status" class="status" role="status" aria-live="polite" hidden></p>

          <div class="keyboard-hint">
            <span>Press</span>
            <kbd>Esc</kbd>
            <span>to exit theatre mode</span>
          </div>
        </section>
      </main>

      <footer class="footer">
        <span>Site rules</span>
        <button id="manageButton" class="manage-button" type="button">
          Manage rules
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4.5 11.5 11 5m0 0H5.5M11 5v5.5"></path>
          </svg>
        </button>
      </footer>
    </div>

    <script src="domain-utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
